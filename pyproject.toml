[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-robotics"
version = "0.1.0"
description = "SPARK: a fixed behavior-tree plan grounded to live 3D perception, with verification and re-grounding at execution time."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "SPARK contributors" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "pyyaml",
    "openai",
    "torch",
]

[project.optional-dependencies]
# The protocol environment of the reported runs. LIBERO and sam3 are submodules in third_party/
# (LIBERO goes on PYTHONPATH through scripts/env.sh; sam3 is the `sim` dependency group below).
bench = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "numpy==2.3.5",
    "mujoco==3.4.0",
    "robosuite==1.4.1",
    "PyOpenGL==3.1.10",
    "h5py==3.16.0",
    "tyro==1.0.16",
    "matplotlib==3.11.2",
    "imageio==2.38.0",
    "opencv-python==5.0.0.93",
    "pillow==12.3.0",
    "scipy==1.18.1",
    "pyyaml==6.0.3",
    "openai==3.22.0",
    # LIBERO
    "bddl==3.6.0",
    "easydict==1.13",
    "cloudpickle==3.1.2",
    "gym==0.26.2",
    "termcolor==3.3.0",
    "thop==0.1.1.post2209072238",
    "einops==0.8.2",
    # sam3
    "timm==1.0.30",
    "iopath==0.1.10",
    "ftfy==6.1.1",
    "regex",
    "tqdm",
    "huggingface_hub==2.0.0",
    "decord==0.6.0",
    "pycocotools==2.0.11",
    "psutil==7.2.2",
]
# Gemini planner backend (SPARK_LLM_BACKEND=gemini, GEMINI_API_KEY).
gemini = ["google-genai"]
# UR10e real-robot module (spark_real). Depth Anything 3 installs from source if used.
ur10e = [
    "ur-rtde>=1.5.6",
    "fastapi",
    "uvicorn",
    "pydantic",
    "websockets",
    "requests",
    "scipy",
    "matplotlib",
    "imageio",
    "imageio-ffmpeg",
    "tyro",
    "pyk4a",
    "pyrealsense2",
    "rfdetr",  # second-opinion detector the shipped config enables (perception.fusion.proposer)
    "jax",
    "jaxlie",
    "pyroki @ git+https://github.com/chungmin99/pyroki.git@388e43e1fc0d0ee382968d3dd72970fd62a0450c",
    "yourdfpy",
    "robot_descriptions",
    "xacrodoc",  # robot_descriptions builds the UR10e URDF from xacro
]
# Franka FR3 module (spark_real --robot franka). franky-control must match the
# robot's libfranka version; build the wheel against the system libfranka if
# the PyPI wheel does not (docs/real_world.md).
franka = [
    "franky-control",
    "fastapi",
    "uvicorn",
    "pydantic",
    "websockets",
    "requests",
    "scipy",
    "matplotlib",
    "imageio",
    "imageio-ffmpeg",
    "tyro",
    "pyk4a",
    "pyrealsense2",
    "jax",
    "jaxlie",
    "pyroki @ git+https://github.com/chungmin99/pyroki.git@388e43e1fc0d0ee382968d3dd72970fd62a0450c",
    "yourdfpy",
    "robot_descriptions",
    "xacrodoc",
]
# Bimanual Franka module (spark_real --robot bimanual): bamboo joint-impedance
# arms, SSG-48 or Dynamixel jaws, ZED Mini. The ZED SDK and its pyzed wrapper
# come from the Stereolabs installer, not pip.
bimanual = [
    "franky-control",
    "panda-python",
    "bamboo-franka-client",
    "Spectral_BLDC==1.18",
    "python-can",
    "dynamixel-sdk",
    "fastapi",
    "uvicorn",
    "pydantic",
    "websockets",
    "requests",
    "scipy",
    "matplotlib",
    "imageio",
    "imageio-ffmpeg",
    "tyro",
    "jax",
    "jaxlie",
    "pyroki @ git+https://github.com/chungmin99/pyroki.git@388e43e1fc0d0ee382968d3dd72970fd62a0450c",
    "yourdfpy",
    "robot_descriptions",
    "xacrodoc",
]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3.5"]

[dependency-groups]
sim = ["sam3"]

[tool.uv]
default-groups = ["sim"]
# sam3 asks for numpy<2; the reported runs used numpy 2.3.5.
override-dependencies = ["numpy==2.3.5"]

[tool.uv.sources]
sam3 = { path = "third_party/sam3", editable = true }
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["spark_core*", "spark_real*", "spark_bench*"]

[tool.setuptools.package-data]
spark_core = ["prompts/*.txt"]
spark_bench = ["*.sh"]
spark_real = ["configs/*.yaml", "configs/*/*.yaml", "frontend/*.html", "frontend/*.css", "frontend/js/*.js", "calibration/*.json", "calibration/*/*.json"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["src/spark_core/tests", "src/spark_bench/tests"]
addopts = "-q"
markers = ["slow: needs the GPU or the simulator; deselect with -m 'not slow'"]
