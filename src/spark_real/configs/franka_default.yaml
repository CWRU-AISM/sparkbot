# Franka FR3 + Franka Hand defaults. Rig values (IP, camera serials) belong in
# configs/machines/<host>.yaml (see machines/franka_example.yaml), passed with
# --machine <host>.
# Launch: python -m spark_real.server --robot franka --machine <host>

robot:
  ip: null                 # FCI address; set in the machine overlay or with --ip
  frequency: 1000          # libfranka control rate (informational)
  backend: "franky"        # franky motion generators (the only single-arm backend)
  # Ready pose (rad). J5 = -0.15 keeps the wrist out of its spherical
  # singularity, where every teleop velocity tick trips a reflex.
  home_config: [0.0, -0.785398, 0.0, -2.356194, -0.15, 1.570796, 0.785398]
  max_joint_velocity: 1.05 # rad/s (FR3 limit ~2.62)
  max_linear_velocity: 0.25 # m/s (FR3 limit ~1.7)

gripper:
  type: "franka_hand"      # any registered type (spark_real.grippers)
  speed: 0.10              # m/s
  force: 70.0              # N
  epsilon_inner: 0.005     # m, grasp tolerance
  epsilon_outer: 0.005
  open_width: 0.08         # m, used only if the Hand does not report max_width

# Executor workspace box (m, base frame; control/family_bounds.py).
workspace:
  x_min: -0.85
  x_max: 0.85
  y_min: -0.85
  y_max: 0.85
  z_min: -0.040            # thin handles sit at -0.025..-0.031 after the descent bias
  z_max: 1.20
  reach_max: 0.855

# Tabletop floor (base frame). The FR3 base sits at table level; the foam
# surface is ~25 mm below z=0.
table_z_floor: -0.025

control:
  grasp_orientation: [3.14159, 0.0, 0.0]   # tool Z down
  max_velocity: 0.10       # executor Cartesian cap (CartesianServo PD stability on the FR3)
  wrist_refine: false      # the wrist hand-eye (~20 mm RMSE) is too coarse to refine on

# Wrist RealSense translation from the TCP (identity rotation). Replaced by
# <calibrations>/handeye_wrist.json once the wrist hand-eye is solved.
wrist_tool_offset_xyz: [0.00, 0.06, -0.05]

stack:
  clearance_m: 0.12
  max_descent_m: 0.15
  contact_force_n: 5.0
  hard_stop_delta_n: 20.0  # the FR3 F/T estimate is zeroed, so delta ~= absolute
  step_m: 0.002
  descent_vel_frac: 0.10

# Task-skill tuning (skills/task_motion.py, tool_use.py, cloth.py), from the
# FR3 task procedures. A value in the plan overrides the one here.
task_motion:
  approach_dz: 0.08        # hover above the object before the descent (m)
  grasp_dz: 0.003          # grasp height above the detected centroid (m)
  retry_step_m: 0.003      # extra descent per empty close (m)
  grasp_retries: 5
  held_width_m: 0.001      # Hand width above this after a close = holding
  lift_dz: 0.10
  slow_vel: 0.08
  press_dz: 0.005          # scrub: press the tool this far below the surface (m)
  scrub_vel: 0.08
  table_z: -0.025          # table surface in the base frame (m)
  sweep_height_m: 0.062    # brush TCP height above the table during a sweep (m)

# Per-primitive hang watchdogs (s), control/primitive_timeouts.py. grasp,
# release and move_to_keypoint are copied from the UR10e and not yet
# re-measured on the FR3.
timeouts:
  move_to_keypoint: 30.0
  move_relative: 2.0
  grasp: 25.0
  release: 20.0
  insert: 6.0
  push_object: 4.0
  open_drawer: 5.0
  wipe: 90.0
  default: 8.0
  place_in_slot: 60.0
  search_keypoint: 60.0
  retract_retry: 60.0
  grasp_se3: 60.0
  constrained_scrub: 90.0
  sponge_wash: 150.0
  pour: 60.0
  sweep: 120.0
  sweep_to_container: 120.0
  cloth_fold_single: 90.0
  cloth_fold: 240.0

# libfranka collision thresholds (Robot.set_collision_behavior). Flat
# 100 Nm / 100 N: tighter 6-10 Nm / 10-12.5 N sets made normal acceleration
# transients trip reflexes on every pick.
collision_behavior:
  joint_torque_acc_lower: [100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0]
  joint_torque_acc_upper: [100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0]
  joint_torque_nom_lower: [100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0]
  joint_torque_nom_upper: [100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0]
  cartesian_force_acc_lower: [100.0, 100.0, 100.0, 100.0, 100.0, 100.0]
  cartesian_force_acc_upper: [100.0, 100.0, 100.0, 100.0, 100.0, 100.0]
  cartesian_force_nom_lower: [100.0, 100.0, 100.0, 100.0, 100.0, 100.0]
  cartesian_force_nom_upper: [100.0, 100.0, 100.0, 100.0, 100.0, 100.0]

# Task-success verification (control/success_verifier.py).
verification:
  enabled: true
  min_conf: 0.35
  require_two_views: false
  inside_xy_margin_m: -0.02
  inside_z_tol_m: 0.06
  fallback_2d_containment: 1.01
  on_missing: unverified
  retry_on_fail: false     # a verified failure is logged, not replayed
  scope:
    enabled: true
    telemetry_short_circuit: true
    reuse_capture_s: 0.0
    anchor_references: false
    condition_anchor_references: true
    fusion: false
    cameras: auto
  release_verdict: false
  attribution: false

trace:
  enabled: true
  save_images: false

place:
  release_giveback: false

# Camera roster (perception/camera_registry.py). Serials go in the machine overlay.
cameras:
  - role: "birdview"
    type: "kinect"
    serial: null
    sync: "subordinate"
  - role: "sideview"
    type: "kinect"
    serial: null
    sync: "master"
  - role: "wrist"
    type: "realsense"
    serial: null
    width: 640
    height: 480
    enabled: true

kinect_depth_mode: WFOV_2X2BINNED
kinect_resolution: 720P
kinect_fps: 15
kinect_use_hw_sync: false    # true only with the sync cable between the Kinects
kinect_master_serial: ""     # names the sideview Kinect; set in the machine overlay

# The packaged seeds are UR10e trees with Robotiq gripper numbers; do not
# serve them to the Franka Hand.
bt:
  seed_on_start: false

perception:
  rebind:
    enabled: true
    log_drift_cm: 2.0
  sticky:
    enabled: false
    gate_m: 0.12
    ambiguity_sep_m: 0.03
    dedup_radius_m: 0.02
  fusion:
    enabled: false
